name: Run API Tests

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: fastapi-postgres-api
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: fastapi-postgres-api
        run: python -m pytest